import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

base {
    archivesName = "Design-n-Decor-$minecraft_version"
    group = mod_group_id
    version = mod_version
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }
    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArgument '--nogui'
    }
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
    data {
        workingDirectory project.file('run-data')

        programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing-mod', 'create'
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

def conditionDyeDepotLootTables = tasks.register('conditionDyeDepotLootTables') {
    group = 'mod development'
    description = 'Adds Dye Depot load conditions to generated loot tables for optional colors.'

    def generatedData = layout.projectDirectory.dir('src/generated/resources/data/dndecor')
    inputs.dir(generatedData.dir('recipe'))
    inputs.dir(generatedData.dir('loot_table/blocks'))

    doLast {
        def recipeDir = generatedData.dir('recipe').asFile
        def lootDir = generatedData.dir('loot_table/blocks').asFile
        if (!recipeDir.isDirectory() || !lootDir.isDirectory()) return

        def parser = new JsonSlurper()
        def conditionalBlockIds = [] as Set
        fileTree(recipeDir).matching { include '**/*.json' }.files.each { recipeFile ->
            def recipe = parser.parse(recipeFile)
            def requiresDyeDepot = recipe['neoforge:conditions']?.any {
                it.type == 'neoforge:mod_loaded' && it.modid == 'dye_depot'
            }
            if (requiresDyeDepot && recipe.result?.id instanceof String) {
                conditionalBlockIds.add(recipe.result.id)
            }
        }

        conditionalBlockIds.each { blockId ->
            def namespaceAndPath = blockId.split(':', 2)
            if (namespaceAndPath.length != 2 || namespaceAndPath[0] != mod_id) return

            def lootFile = new File(lootDir, "${namespaceAndPath[1]}.json")
            if (!lootFile.isFile()) return

            def lootTable = ['neoforge:conditions': [[
                    type : 'neoforge:mod_loaded',
                    modid: 'dye_depot'
            ]]]
            lootTable.putAll(parser.parse(lootFile))

            def formatted = JsonOutput.prettyPrint(JsonOutput.toJson(lootTable))
            def twoSpaceFormatted = formatted.readLines().collect { line ->
                int indent = 0
                while (indent < line.length() && line.charAt(indent) == ' ') indent++
                (' ' * indent.intdiv(2)) + line.substring(indent)
            }.join('\n') + '\n'
            lootFile.setText(twoSpaceFormatted, 'UTF-8')
        }
    }
}

tasks.configureEach {
    if (name == 'runData') finalizedBy conditionDyeDepotLootTables
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    maven { url = "https://maven.createmod.net" } // Ponder, Flywheel
    maven { url = "https://mvn.devos.one/snapshots" } // Registrate
    maven { url = "https://maven.blamejared.com" } // JEI, Vazkii's Mods
    maven { url = "https://www.cursemaven.com" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://modmaven.dev" }
    maven { url = "https://maven.architectury.dev" } // Arch API
    maven { url = "https://registry.somethingcatchy.net/repository/maven-releases/" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // NeoForge config api port, needed by ponder
    mavenLocal()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${flywheel_minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${flywheel_minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    implementation("mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}")

    implementation("com.ninni.dye_depot:dye_depot:$minecraft_version-$dye_depot_version-neoforge")

    compileOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}:api")
    runtimeOnly("top.theillusivec4.curios:curios-neoforge:${curios_version}+${curios_minecraft_version}")

    //compileOnly("maven.modrinth:sodium:mc${minecraft_version}-${sodium_version}-neoforge")
    implementation("maven.modrinth:jade:jBPaSUDN")
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            flywheel_version_range   : flywheel_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
